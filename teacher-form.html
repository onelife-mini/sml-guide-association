<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="description" content="日月潭觀光導覽暨交流協會：日月潭在地導覽老師組成的協會，飯店與團體導覽需求由協會窗口統一接洽。">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老師資料登記｜日月潭觀光導覽暨交流協會</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="members">
<div id="site-header"></div>
<main>

<div class="wrap crumb"><a href="members.html">會員專區</a>　／　老師資料登記</div>

<section class="wrap section" style="padding-top: 24px">
<form class="form-card" data-send="teacher" data-done="已收到你的資料，協會窗口確認後會放上網站。">
  <h2>老師資料登記</h2>
  <div class="notice"><span class="ic" aria-hidden="true">✓</span><div><small>公開範圍</small>這份資料會放上協會網站的「導覽老師」頁。<b>手機只給協會窗口聯絡用，不會公開。</b></div></div>
  <div class="steps3"><div><span class="step">STEP 1</span><b>填寫資料</b><span>約 5 分鐘</span></div><div><span class="step">STEP 2</span><b>協會確認</b><span>窗口檢查內容</span></div><div><span class="step">STEP 3</span><b>上架網站</b><span>出現在導覽老師頁</span></div></div>
  <div class="fgrid"><label class="f" for="f-14947016">姓名<span class="req">*</span><input id="f-14947016" type="text" name="姓名" required></label><label class="f" for="f-87351863">英文名或族名<small>沒有可空白</small><input id="f-87351863" type="text" name="英文名或族名"></label></div>
  <label class="f" for="f-52463497">手機<span class="req">*</span><input id="f-52463497" type="tel" name="手機" required placeholder="只給協會窗口聯絡用"></label>
  <div class="f" role="group" aria-label="可導覽的語言">可導覽的語言<span class="req">*</span><small>可複選</small><div class="pills" data-required data-label="可導覽的語言"><label><input type="checkbox" name="語言" value="中文"><span>中文</span></label><label><input type="checkbox" name="語言" value="台語"><span>台語</span></label><label><input type="checkbox" name="語言" value="客語"><span>客語</span></label><label><input type="checkbox" name="語言" value="邵語"><span>邵語</span></label><label><input type="checkbox" name="語言" value="英文"><span>英文</span></label><label><input type="checkbox" name="語言" value="日文"><span>日文</span></label><label><input type="checkbox" name="語言" value="韓文"><span>韓文</span></label><label><input type="checkbox" name="語言" value="其他"><span>其他</span></label></div></div>
  <div class="f" role="group" aria-label="導覽專長">導覽專長<span class="req">*</span><small>可複選</small><div class="pills" data-required data-label="導覽專長"><label><input type="checkbox" name="專長" value="自然生態"><span>自然生態</span></label><label><input type="checkbox" name="專長" value="人文歷史"><span>人文歷史</span></label><label><input type="checkbox" name="專長" value="邵族文化"><span>邵族文化</span></label><label><input type="checkbox" name="專長" value="茶產業"><span>茶產業</span></label><label><input type="checkbox" name="專長" value="宗教寺廟"><span>宗教寺廟</span></label><label><input type="checkbox" name="專長" value="步道與單車"><span>步道與單車</span></label><label><input type="checkbox" name="專長" value="其他"><span>其他</span></label></div></div>
  <div class="fgrid"><label class="f" for="f-87619201">導覽年資<input id="f-87619201" type="text" name="年資" placeholder="例：12 年"></label><label class="f" for="f-33490084">居住地<input id="f-33490084" type="text" name="居住地" placeholder="例：魚池鄉日月村"></label><label class="f" for="f-30484289">相關證照<input id="f-30484289" type="text" name="證照" placeholder="例：導遊證"></label></div>
  <label class="f" for="f-60078011">一句話<span class="req">*</span><small>會直書放在你的照片上，15 字以內</small><input id="f-60078011" type="text" name="一句話" required placeholder="例：湖的故事，要慢慢聽"></label>
  <label class="f" for="f-93068000">自我介紹<span class="req">*</span><small>150 字以內</small><textarea id="f-93068000" name="自我介紹" required placeholder="什麼時候開始導覽、最喜歡帶旅人認識日月潭的哪一面"></textarea></label>
  <label class="f" for="f-92326483">擅長的導覽路線<textarea id="f-92326483" name="擅長路線" placeholder="一行一條，例：伊達邵老街與邵族文化，90 分鐘，適合家庭"></textarea></label>
  <div class="f">老師照片<small>半身、背景乾淨、表情自然；手機直接拍也可以</small>
    <div class="photo-pick"><div class="prev" aria-hidden="true">尚未選擇</div><input type="file" name="photo" accept="image/jpeg,image/png" id="t-photo" aria-label="選擇照片"></div></div>
  <label class="agree"><input type="checkbox" name="公開同意" value="是" required><span>我同意協會將我的姓名、照片、語言、專長、一句話、自我介紹與路線公開在協會網站。</span></label>
  <label class="hp" aria-hidden="true">請勿填寫<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  <p class="form-msg" role="status" hidden></p>
  <button class="btn" type="submit" style="align-self: flex-start">送出老師資料</button>
</form>
</section>

</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="site.js"></script>
<script src="forms.js"></script>
</body>
</html>
